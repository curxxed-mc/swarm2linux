[workspace]
members = ["crates/race-hid", "crates/tb-proto", "crates/stealth-dbus", "crates/stealthctl", "crates/stealthd", "crates/stealth-gui", "crates/sink-volume", "crates/stealth-tui", "crates/stealth-doctor", "crates/stealth-voice"]
# stealth-voice builds whisper.cpp (cmake, a C++ compiler); install.sh builds it when those are there
default-members = ["crates/race-hid", "crates/tb-proto", "crates/stealth-dbus", "crates/stealthctl", "crates/stealthd", "crates/stealth-gui", "crates/sink-volume", "crates/stealth-tui", "crates/stealth-doctor"]
resolver = "3"

[workspace.package]
version = "1.3.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
race-hid = { path = "crates/race-hid" }
tb-proto = { path = "crates/tb-proto" }
stealth-dbus = { path = "crates/stealth-dbus" }
sink-volume = { path = "crates/sink-volume" }
stealth-doctor = { path = "crates/stealth-doctor" }
zbus = "5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
